apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-study
  labels:
    app: cert-study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cert-study
  template:
    metadata:
      labels:
        app: cert-study
    spec:
      containers:
        - name: cert-study
          image: cert-study:latest
          ports:
            - containerPort: 80
          env:
            - name: OLLAMA_BASE
              value: "http://ollama:11434"
            # Optional: kubectl create secret generic cert-study-firebase \
            #   --from-file=config=./firebase-web-config.json
            # Use the PUBLIC Firebase web app config, never a service account key.
            - name: FIREBASE_CONFIG
              valueFrom:
                secretKeyRef:
                  name: cert-study-firebase
                  key: config
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30

